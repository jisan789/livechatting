<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Offline — LiveChat</title>
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 10%, #E2E8F0 0%, #CBD5E1 60%, #94A3B8 100%);
      color: #0F172A;
      padding: 20px;
    }
    .offline-card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.4);
    }
    .icon-wrap {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.35);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #64748B;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(180deg, #8B5CF6 0%, #7C3AED 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(124, 58, 237, 0.32);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-retry:active {
      transform: scale(0.98);
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.25);
    }
    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 12px;
      color: #94A3B8;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #EF4444;
      display: inline-block;
    }
    .dot.online {
      background: #10B981;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>No Connection</h1>
    <p>LiveChat is a real-time messaging app and requires an active network connection to send and receive messages.</p>
    <button class="btn-retry" id="retryBtn" onclick="tryReconnect()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      <span>Try Reconnecting</span>
    </button>
    <div class="status-indicator">
      <span class="dot" id="netDot"></span>
      <span id="netStatus">You are currently offline</span>
    </div>
  </div>

  <script>
    function tryReconnect() {
      const btn = document.getElementById('retryBtn');
      btn.textContent = 'Checking...';
      if (navigator.onLine) {
        window.location.href = '/';
      } else {
        setTimeout(() => {
          btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg> <span>Try Reconnecting</span>';
        }, 800);
      }
    }

    window.addEventListener('online', () => {
      document.getElementById('netDot').className = 'dot online';
      document.getElementById('netStatus').textContent = 'Back online! Reconnecting...';
      setTimeout(() => {
        window.location.href = '/';
      }, 600);
    });

    window.addEventListener('offline', () => {
      document.getElementById('netDot').className = 'dot';
      document.getElementById('netStatus').textContent = 'You are currently offline';
    });
  </script>
</body>
</html>
